[theme]
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
linkColor = "#0066cc"
borderColor = "#d2d2d7"
showWidgetBorder = false
baseRadius = "12px"
buttonRadius = "980px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = 600

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
